<!DOCTYPE html>
<html>

<head>

<title>AI Interview Assistant</title>

<style>

body{
font-family:Arial;
margin:40px;
background:#f4f4f4;
}

.card{
background:white;
padding:20px;
margin-bottom:20px;
border-radius:8px;
}

textarea{
width:100%;
height:80px;
margin-top:10px;
}

button{
margin-top:10px;
padding:10px;
background:blue;
color:white;
border:none;
}

.feedback{
color:green;
margin-top:10px;
}

</style>

</head>

<body>

<h1>AI Interview Assistant</h1>

<div id="questions"></div>

<script>

window.onload = loadQuestions;

function loadQuestions(){

fetch("http://localhost:8080/api/interview/question")

.then(res=>res.json())

.then(data=>{

let container =
document.getElementById("questions");

container.innerHTML="";

data.forEach(q=>{

container.innerHTML += `

<div class="card">

<h3>${q.questionText}</h3>

<textarea id="answer_${q.id}"></textarea>

<br>

<button onclick="submitAnswer(${q.id})">
Submit
</button>

<p id="result_${q.id}" class="feedback"></p>

</div>

`;

});

});

}

function submitAnswer(id){

let answer =
document.getElementById("answer_"+id).value;

fetch("http://localhost:8080/api/interview/answer",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
questionId:id,
answer:answer
})

})

.then(res=>res.json())

.then(data=>{

document.getElementById("result_"+id).innerText =
data.feedback;

})

.catch(error=>{
console.log(error);
});

}

</script>

</body>

</html>
